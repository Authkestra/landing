<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#09090b" />
  
  <!-- Subtle Grid Texture -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#27272a" stroke-width="1" stroke-opacity="0.4" />
    </pattern>
    <radialGradient id="glow" cx="60%" cy="40%" r="50%" fx="60%" fy="40%">
      <stop offset="0%" stop-color="#b7410e" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#ce422b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="amber-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4845f" />
      <stop offset="100%" stop-color="#ce422b" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Outer Border -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#27272a" stroke-width="1.5" />

  <!-- Brand Mark & Name -->
  <g transform="translate(80, 80)">
    <svg width="48" height="48" viewBox="0 0 32 32" fill="none">
      <path d="M5.5 27.5 16 5l10.5 22.5" stroke="#fafafa" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="10" y="17.6" width="12" height="2.8" rx="1.4" fill="#ce422b" />
    </svg>
    <text x="64" y="34" font-family="system-ui, -apple-system, Inter, sans-serif" font-size="32" font-weight="700" fill="#fafafa" letter-spacing="-0.02em">authkestra</text>
  </g>

  <!-- Category Tag -->
  <g transform="translate(80, 160)">
    <rect width="280" height="34" rx="17" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
    <circle cx="18" cy="17" r="4" fill="#f4845f" />
    <text x="32" y="22" font-family="system-ui, -apple-system, Inter, sans-serif" font-size="14" font-weight="600" fill="#a1a1aa" letter-spacing="0.02em">PURE RUST IDENTITY &amp; MCP ENGINE</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="255" font-family="system-ui, -apple-system, Inter, sans-serif" font-size="44" font-weight="800" fill="#fafafa" letter-spacing="-0.025em">
    The Compile-Time Safe Identity &amp;
  </text>
  <text x="80" y="315" font-family="system-ui, -apple-system, Inter, sans-serif" font-size="44" font-weight="800" fill="url(#amber-accent)" letter-spacing="-0.025em">
    AI Agent Authorization Engine
  </text>

  <!-- Subheadline -->
  <text x="80" y="380" font-family="system-ui, -apple-system, Inter, sans-serif" font-size="20" font-weight="400" fill="#a1a1aa">
    OAuth 2.1 Provider · Passkeys · Cedar Policy · Model Context Protocol (MCP) Guard
  </text>

  <!-- Badges Grid -->
  <g transform="translate(80, 430)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="190" height="42" rx="8" fill="#18181b" stroke="#27272a" />
    <text x="95" y="26" text-anchor="middle" font-family="system-ui, Inter, sans-serif" font-size="14" font-weight="500" fill="#d4d4d8">OAuth 2.1 &amp; OIDC</text>

    <!-- Badge 2 -->
    <rect x="206" y="0" width="180" height="42" rx="8" fill="#18181b" stroke="#27272a" />
    <text x="296" y="26" text-anchor="middle" font-family="system-ui, Inter, sans-serif" font-size="14" font-weight="500" fill="#d4d4d8">WebAuthn Level 3</text>

    <!-- Badge 3 -->
    <rect x="402" y="0" width="210" height="42" rx="8" fill="#18181b" stroke="#27272a" />
    <text x="507" y="26" text-anchor="middle" font-family="system-ui, Inter, sans-serif" font-size="14" font-weight="500" fill="#d4d4d8">RFC 8785 JCS Binding</text>

    <!-- Badge 4 -->
    <rect x="628" y="0" width="190" height="42" rx="8" fill="#18181b" stroke="#27272a" />
    <text x="723" y="26" text-anchor="middle" font-family="system-ui, Inter, sans-serif" font-size="14" font-weight="500" fill="#d4d4d8">Zero-Trust MCP Vault</text>

    <!-- Badge 5 -->
    <rect x="834" y="0" width="170" height="42" rx="8" fill="#18181b" stroke="#27272a" />
    <text x="919" y="26" text-anchor="middle" font-family="system-ui, Inter, sans-serif" font-size="14" font-weight="500" fill="#d4d4d8">Typestate Safe</text>
  </g>

  <!-- Terminal Snippet Bottom Right -->
  <g transform="translate(80, 508)">
    <rect width="440" height="48" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
    <text x="20" y="30" font-family="JetBrains Mono, monospace" font-size="16" fill="#f4845f" font-weight="500">$</text>
    <text x="40" y="30" font-family="JetBrains Mono, monospace" font-size="16" fill="#fafafa">cargo add authkestra</text>
  </g>

  <!-- Domain Tag Bottom Right -->
  <text x="1120" y="540" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="18" font-weight="500" fill="#71717a">
    https://authkestra.com
  </text>
</svg>
